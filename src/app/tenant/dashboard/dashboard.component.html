<div class="container-fluid p-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="mb-0">Tenant Dashboard</h2>
        <button class="btn btn-outline-danger" (click)="logout()">Logout</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Welcome, {{ user?.fullName || 'User' }}</h5>
          <p class="card-text text-muted">{{ user?.email }}</p>
          <p class="card-text"><small>Tenant ID: {{ user?.tenantId }}</small></p>
        </div>
      </div>
    </div>

    <div class="col-md-8 mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Quick Actions</h5>
          <div class="d-grid gap-2">
            <a [routerLink]="['/admin/dashboard']" class="btn btn-primary">Go to Admin Panel</a>
            <a [routerLink]="[goToWebsite()]" class="btn btn-outline-primary">Browse Website</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Your Business</h5>
          <p class="card-text">Manage your website, orders, and settings from the admin panel.</p>
        </div>
      </div>
    </div>
  </div>
</div>
