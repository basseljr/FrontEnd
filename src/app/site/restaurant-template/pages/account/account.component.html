<div class="container-fluid p-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="mb-0">My Account</h2>
        <button class="btn btn-outline-danger" (click)="logout()">Logout</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6 mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Profile Information</h5>
          <p class="card-text"><strong>Name:</strong> {{ user?.fullName || 'N/A' }}</p>
          <p class="card-text"><strong>Email:</strong> {{ user?.email || 'N/A' }}</p>
        </div>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Quick Actions</h5>
          <div class="d-grid gap-2">
            <button class="btn btn-primary" (click)="goToOrderHistory()">View Order History</button>
            <a [routerLink]="['/site', slug]" class="btn btn-outline-primary">Back to Home</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
