<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center" style="background-color: #f8f9fa; padding-top: 80px; padding-bottom: 80px;">
  <div class="card shadow-sm" style="max-width: 500px; width: 100%; border: none;">
    <div class="card-body p-4">
      <!-- Back Arrow -->
      <button 
        type="button" 
        class="btn btn-link p-0 mb-3 text-decoration-none" 
        (click)="goBack()"
        style="color: #333;">
        <i class="bi bi-arrow-left fs-5"></i>
      </button>

      <!-- Title -->
      <h2 class="text-center mb-4 fw-bold" style="color: #dc3545;">CREATE AN ACCOUNT</h2>

      <!-- General Error Message -->
      <div *ngIf="errors['general']" class="alert alert-danger mb-3" role="alert">
        {{ errors['general'] }}
      </div>

      <!-- Register Form -->
      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <!-- Name Field -->
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            [(ngModel)]="name"
            placeholder="Enter Your Name"
            required
            [class.is-invalid]="errors['name']"
          />
          <div *ngIf="errors['name']" class="text-danger small mt-1">{{ errors['name'] }}</div>
        </div>

        <!-- Email Field -->
        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter Your Email"
            required
            [class.is-invalid]="errors['email']"
          />
          <div *ngIf="errors['email']" class="text-danger small mt-1">{{ errors['email'] }}</div>
        </div>

        <!-- Mobile Number Field -->
        <div class="mb-3">
          <label for="mobileNumber" class="form-label fw-semibold">Mobile Number</label>
          <input
            type="tel"
            class="form-control"
            id="mobileNumber"
            name="mobileNumber"
            [(ngModel)]="mobileNumber"
            placeholder="Enter Your Mobile Number"
            required
            [class.is-invalid]="errors['mobile']"
          />
          <div *ngIf="errors['mobile']" class="text-danger small mt-1">{{ errors['mobile'] }}</div>
        </div>

        <!-- Password Field -->
        <div class="mb-3">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter Your Password"
            required
            [class.is-invalid]="errors['password']"
          />
          <div *ngIf="errors['password']" class="text-danger small mt-1">{{ errors['password'] }}</div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn w-100 mb-3 text-white fw-bold"
          [disabled]="loading"
          style="background-color: #dc3545; height: 45px;"
          [class.opacity-50]="loading"
        >
          <span *ngIf="!loading">SUBMIT</span>
          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Registering...
          </span>
        </button>

        <!-- Login Link -->
        <div class="text-center">
          <span class="text-muted">Already have an account? </span>
          <a [routerLink]="['/site', slug, 'login']" class="text-decoration-none fw-semibold" style="color: #dc3545;">Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
