<section class="categories-section container py-5">
  <h2 class="text-center mb-4 fw-bold" [style.color]="customData.textColor">
    Our Menu
  </h2>

  <!-- Loading Spinner -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-danger" role="status"></div>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-danger text-center">
    {{ errorMessage }}
  </div>

  <!-- Categories Grid -->
  <div *ngIf="!loading && !errorMessage" class="row g-4">
    <div
      class="col-12 col-sm-6 col-lg-4"
      *ngFor="let category of categories"
    >
      <div
        class="category-card text-center shadow-sm rounded-3 h-100 p-3"
        appEditable
        [editableType]="'image'"
        [section]="'categories'"
        [key]="category.id + '-image'"
        (click)="openCategory(category.id)"
        style="cursor: pointer"
      >
        <img
          [src]="category.imageUrl || 'assets/images/placeholder.png'"
          [alt]="category.name"
          class="img-fluid rounded"
          appEditable
          [editableType]="'image'"
          [section]="'categories'"
          [key]="category.id + '-image'"
        />

        <h5
          class="fw-bold mt-3 category-title"
          appEditable
          [editableType]="'text'"
          [section]="'categories'"
          [key]="category.id + '-name'"
          [style.color]="customData.textColor"
        >
          {{ category.name }}
        </h5>
      </div>
    </div>
  </div>
</section>
