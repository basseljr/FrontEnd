<section class="container py-5">
    <h2 class="text-danger fw-bold mb-4 text-center">Order History</h2>
  
    <div class="mb-3 text-center">
      <input
        type="text"
        class="form-control w-auto d-inline-block text-center"
        placeholder="Enter your mobile number"
        [(ngModel)]="mobile"
      />
      <button class="btn btn-danger ms-2" (click)="searchOrders()">Search</button>
    </div>
  
    <div *ngIf="loading" class="text-center">Loading...</div>
    <div *ngIf="error" class="text-danger text-center">{{ error }}</div>
  
    <div *ngIf="orders.length > 0">
      <div *ngFor="let order of orders" class="card mb-3 shadow-sm">
        <div class="card-body">
          <h5 class="card-title text-danger">Order #{{ order.id }}</h5>
          <p class="mb-1"><strong>Status:</strong> {{ order.status }}</p>
          <p class="mb-1"><strong>Total:</strong> KWD {{ order.total }}</p>
          <p class="mb-1"><strong>Mode:</strong> {{ order.mode }}</p>
          <ul class="list-group mt-2">
            <li *ngFor="let item of order.items" class="list-group-item d-flex justify-content-between">
              <span>{{ item.quantity }} × {{ item.itemName }}</span>
              <span>KWD {{ item.price }}</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>
