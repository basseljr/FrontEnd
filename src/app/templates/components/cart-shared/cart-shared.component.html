<section class="container py-4">
  <h2 class="text-center mb-4">Your Cart</h2>

  <div *ngIf="items.length === 0" class="text-center text-muted">
    Your cart is empty.
  </div>

  <div class="row g-3" *ngIf="items.length > 0">
    <div class="col-12 col-md-6" *ngFor="let item of items">
      <div class="card p-3 shadow-sm d-flex flex-row align-items-center">
        <img [src]="item.imageUrl" class="me-3" width="80" height="80" alt="{{ item.name }}" />
        <div class="flex-grow-1">
          <h5 class="mb-1">{{ item.name }}</h5>
          <p class="mb-0">
            <span *ngIf="item.originalPrice && item.originalPrice !== item.price" class="old-price">
              {{ item.originalPrice | currency:'KWD' }}
            </span>
            <span class="new-price">
              {{ item.price | currency:'KWD' }}
            </span>
          </p>
          <div class="mt-2 d-flex align-items-center">
            <button class="btn btn-outline-secondary btn-sm me-2" (click)="decrease(item)">−</button>
            <span>{{ item.quantity }}</span>
            <button class="btn btn-outline-secondary btn-sm ms-2" (click)="increase(item)">+</button>
          </div>
        </div>
        <button class="btn btn-danger btn-sm ms-auto" (click)="remove(item.id)">
          Remove
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="items.length > 0" class="text-end mt-4">
    <h4>Total: KWD {{ total | number:'1.3-3' }}</h4>
    <button class="btn btn-outline-danger me-2" (click)="clear()">Clear Cart</button>
    <button class="btn btn-danger" [routerLink]="['../checkout']">Checkout</button>
  </div>
</section>
