<!-- Responsive Restaurant Header -->
<nav
 class="navbar navbar-expand-lg px-3 py-2 fixed-top"
 appEditable
  [editableType]="'background'"
  [section]="'header'"
  [key]="'backgroundColor'"
  [style.backgroundColor]="customData.backgroundColor">

  <div class="container-fluid align-items-center justify-content-between">


  <a
   class="navbar-brand fw-bold d-none d-lg-block"
      appEditable
    [editableType]="'text'"
    [section]="'header'"
    [key]="'name'"
    [style.color]="customData.textColor"
    >{{ customData.name }}</a>

    <!-- Search Bar (visible on all sizes but resizes & changes position) -->
    <form class="search-bar d-flex align-items-center flex-grow-1 mx-2">
      <i class="bi bi-search text-white fs-5 me-2"></i>
      <input
        type="text"
        class=" sbar form-control bg-white border-0 rounded-pill"
        placeholder="Search..."
      />
    </form>

    <!-- Cart + Language + Login (always visible) -->
    <div class="d-flex align-items-center">
          <a
        class="text-white position-relative mx-2"
        style="cursor: pointer"
        (click)="goToCart()"
      >
        <i class="bi bi-bag fs-4"></i>
        <span
          *ngIf="cartCount > 0"
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-white text-danger"
        >
          {{ cartCount }}
        </span>
      </a>
      <!-- Live site: Show only Login/Logout -->
      <ng-container *ngIf="isLiveSite()">
        <a *ngIf="!isLoggedIn()" 
           (click)="goToLogin()" 
           class="text-white fw-semibold text-decoration-none mx-2" 
           style="cursor: pointer;">LOGIN</a>
        <a *ngIf="isLoggedIn()" 
           (click)="logout()" 
           class="text-white fw-semibold text-decoration-none mx-2" 
           style="cursor: pointer;">Logout</a>
      </ng-container>

      <!-- Hide all customization buttons on live sites -->
      <ng-container *ngIf="!isLiveSite()">
        <!-- Authentication UI based on role -->
        <!-- Admin -->
        <div class="d-flex align-items-center mx-2" *ngIf="!isPreview() && isAdmin()">
          <a [routerLink]="['/admin/dashboard']" class="text-white fw-semibold text-decoration-none me-3">Admin Dashboard</a>
          <a (click)="logout()" class="text-white fw-semibold text-decoration-none" style="cursor: pointer;">Logout</a>
        </div>
        <!-- Real tenant: Show only Logout (buttons moved to sidebar) -->
        <a *ngIf="isRealTenant() && isLoggedIn()" 
           (click)="logout()" 
           class="text-white fw-semibold text-decoration-none mx-2" 
           style="cursor: pointer;">Logout</a>
        <!-- Tenant login (preview + demo + platform) - Show if NOT logged in -->
        <a *ngIf="!isPublishedSite() && !isLoggedIn()" 
           (click)="goToLogin()" 
           class="text-white fw-semibold text-decoration-none mx-2" 
           style="cursor: pointer;">LOGIN</a>
        <!-- End-user login (only site) - Show if NOT logged in -->
        <a *ngIf="isPublishedSite() && !isEndUserLoggedIn()" 
           [routerLink]="['/site', currentSlug, 'login']" 
           class="text-white fw-semibold text-decoration-none mx-2">LOGIN</a>
        <!-- Logout (when logged in, but not real tenant) -->
        <a *ngIf="isLoggedIn() && !isRealTenant()" 
           (click)="logout()" 
           class="text-white fw-semibold text-decoration-none mx-2" 
           style="cursor: pointer;">Logout</a>
        <!-- End User Account (only site) -->
        <a *ngIf="isPublishedSite() && isEndUserLoggedIn()" 
           (click)="goToAccount()" 
           class="text-white fw-semibold text-decoration-none me-3 mx-2" 
           style="cursor: pointer;">My Account</a>
      </ng-container>
      <a href="#" class="text-white fw-bold fs-5 mx-2">ع</a>
    </div>
  </div>
</nav>


<!-- Header Navbar -->
    


<!-- Bottom Navigation (Mobile Only) -->
<nav
  class="navbar navbar-light border-top fixed-bottom d-flex d-lg-none justify-content-around py-2"
  appEditable
  [editableType]="'background'"
  [section]="'header'"
  [key]="'bottomNavBackground'"
  [style.backgroundColor]="customData.bottomNavBackground"
>
  <a href="#" class="text-center text-danger text-decoration-none">
    <i class="bi bi-list fs-4"></i>
    <div class="small">Menu</div>
  </a>
  <a href="#" class="text-center text-secondary text-decoration-none">
    <i class="bi bi-search fs-4"></i>
    <div class="small">Lookup</div>
  </a>
  <a href="#" class="text-center text-secondary text-decoration-none">
    <i class="bi bi-bag fs-4"></i>
    <div class="small">Cart</div>
  </a>
  <!-- Login (when NOT logged in) -->
  <a (click)="goToLogin()" class="text-center text-secondary text-decoration-none" style="cursor: pointer;" *ngIf="!isPublishedSite() && !isLoggedIn()">
    <i class="bi bi-person fs-4"></i>
    <div class="small">Login</div>
  </a>
  <a [routerLink]="['/site', currentSlug, 'login']" class="text-center text-secondary text-decoration-none" *ngIf="isPublishedSite() && !isEndUserLoggedIn()">
    <i class="bi bi-person fs-4"></i>
    <div class="small">Login</div>
  </a>
  <!-- Logout (when logged in) -->
  <a (click)="logout()" class="text-center text-secondary text-decoration-none" style="cursor: pointer;" *ngIf="isLoggedIn()">
    <i class="bi bi-box-arrow-right fs-4"></i>
    <div class="small">Logout</div>
  </a>
  <!-- End User Account (only site) -->
  <a (click)="goToAccount()" class="text-center text-secondary text-decoration-none" style="cursor: pointer;" *ngIf="isPublishedSite() && isEndUserLoggedIn()">
    <i class="bi bi-person fs-4"></i>
    <div class="small">Account</div>
  </a>
  <a href="#" class="text-center text-secondary text-decoration-none">
    <i class="bi bi-grid fs-4"></i>
    <div class="small">More</div>
  </a>
</nav>
