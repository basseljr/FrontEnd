<div class="modal fade" [class.show]="isOpen" [style.display]="isOpen ? 'block' : 'none'" 
     tabindex="-1" (click)="closeModal()" *ngIf="isOpen">
  <div class="modal-dialog" (click)="stopPropagation($event)">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ item ? 'Edit' : 'Add' }} Menu Item</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <form (ngSubmit)="onSubmit()">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Name *</label>
            <input type="text" class="form-control" [(ngModel)]="formData.name" 
                   name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category *</label>
            <select class="form-select" [(ngModel)]="formData.categoryId" 
                    name="categoryId" required>
              <option value="0">Select Category</option>
              <option *ngFor="let cat of categories" [value]="cat.id">
                {{ cat.name }}
              </option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" [(ngModel)]="formData.description" 
                      name="description" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Price (KWD) *</label>
            <input type="number" class="form-control" [(ngModel)]="formData.price" 
                   name="price" step="0.01" min="0" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" 
                   [(ngModel)]="formData.isTrackStock" name="isTrackStock" id="isTrackStock">
            <label class="form-check-label" for="isTrackStock">
              Track Stock
            </label>
            <small class="form-text text-muted d-block">
              Enable stock tracking for this item. If disabled, availability is manually controlled.
            </small>
          </div>
          <div class="mb-3" *ngIf="formData.isTrackStock">
            <label class="form-label">Stock Quantity</label>
            <input type="number" class="form-control" [(ngModel)]="formData.stockQuantity" 
                   name="stockQuantity" step="1" min="0">
            <div *ngIf="formData.stockQuantity === 0" class="text-danger small mt-1">
              ⚠️ Will be marked as unavailable
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Discount Percentage (0-100)</label>
            <input type="number" class="form-control" [(ngModel)]="formData.discountPercentage" 
                   name="discountPercentage" step="0.01" min="0" max="100">
          </div>
          <div class="mb-3" *ngIf="formData.discountPercentage && formData.discountPercentage > 0">
            <div class="alert alert-info">
              <strong>Final Price:</strong> 
              <span class="text-danger fw-bold">{{ finalPrice | number:'1.2-2' }} KWD</span>
              <span *ngIf="formData.price" class="text-muted ms-2">
                <del>{{ formData.price | number:'1.2-2' }} KWD</del>
              </span>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input type="url" class="form-control" [(ngModel)]="formData.imageUrl" 
                   name="imageUrl">
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" 
                   [(ngModel)]="formData.isAvailable" name="isAvailable" id="isAvailable">
            <label class="form-check-label" for="isAvailable">
              Available
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="isOpen" *ngIf="isOpen"></div>
