<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Menu Management</h2>
    <button class="btn btn-primary" (click)="addItem()">
      <i class="bi bi-plus-circle"></i> Add Item
    </button>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <div class="row">
        <div class="col-md-4">
          <label class="form-label">Filter by Category</label>
          <select class="form-select" [(ngModel)]="selectedCategoryId" (change)="onCategoryFilter()">
            <option [value]="0">All Categories</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="row g-3" *ngIf="!loading">
    <div class="col-md-4 col-lg-3" *ngFor="let item of filteredItems; trackBy: trackByItemId">
      <div class="card h-100">
        <img [src]="item.imageUrl || 'https://via.placeholder.com/300'" 
             class="card-img-top" 
             [alt]="item.name"
             style="height: 200px; object-fit: cover;">
        <div class="card-body">
          <h5 class="card-title">{{ item.name }}</h5>
          <p class="card-text text-muted small">{{ item.description }}</p>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
              <span *ngIf="item.discountPercentage && item.discountPercentage > 0" class="fw-bold text-danger me-2">
                {{ (item.price - (item.price * (item.discountPercentage / 100))) | number:'1.2-2' }} KWD
              </span>
              <span *ngIf="item.discountPercentage && item.discountPercentage > 0" class="text-muted">
                <del>{{ item.price | number:'1.2-2' }} KWD</del>
              </span>
              <span *ngIf="!item.discountPercentage || item.discountPercentage === 0" class="fw-bold text-primary">
                {{ item.price | number:'1.2-2' }} KWD
              </span>
            </div>
            <span class="badge" [ngClass]="getStatusBadgeClass(item)">
              {{ getStatusText(item) }}
            </span>
          </div>
          <div class="btn-group w-100" role="group">
            <button class="btn btn-sm btn-outline-primary" (click)="editItem(item)">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button class="btn btn-sm btn-outline-warning" 
                    (click)="toggleAvailability(item)">
              <i [class]="item.isAvailable ? 'bi bi-x-circle' : 'bi bi-check-circle'"></i>
              {{ item.isAvailable ? 'Disable' : 'Enable' }}
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteItem(item.id!)">
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12" *ngIf="filteredItems.length === 0">
      <div class="text-center text-muted py-5">
        No menu items found
      </div>
    </div>
  </div>

  <app-add-edit-item-form 
    [item]="selectedItem"
    [categories]="categories"
    [isOpen]="isFormOpen"
    (save)="saveItem($event)"
    (close)="closeForm()">
  </app-add-edit-item-form>
</div>
