<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Analytics</h2>
    <button class="btn btn-success" (click)="exportToCSV()">
      <i class="bi bi-download"></i> Export CSV
    </button>
    <div class="mb-3">
      <select [(ngModel)]="selectedFilter" (change)="onPeriodChange()" class="form-select w-auto">
        <option value="today">Today</option>
        <option value="yesterday">Yesterday</option>
        <option value="last7">Last 7 Days</option>
        <option value="last30">Last 30 Days</option>
        <option value="thisMonth">This Month</option>
        <option value="custom">Custom Range</option>
      </select>
    </div>
    
    <div *ngIf="selectedFilter === 'custom'" class="d-flex gap-2 mb-3">
      <input type="date" [(ngModel)]="startDate" class="form-control w-auto">
      <input type="date" [(ngModel)]="endDate" class="form-control w-auto">
      <button class="btn btn-primary" (click)="applyCustom()">Apply</button>
    </div>
    
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!loading">
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <app-chart-widget 
          title="Daily Sales Trend"
          type="line"
          [data]="salesChartData">
        </app-chart-widget>
      </div>
      <div class="col-md-6">
        <app-chart-widget 
          title="Top Selling Items"
          type="bar"
          [data]="topItemsChartData">
        </app-chart-widget>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <app-chart-widget 
          title="Order Status Breakdown"
          type="pie"
          [data]="statusChartData">
        </app-chart-widget>
      </div>
      <div class="col-md-6">
        <app-chart-widget 
          title="New vs Returning Customers"
          type="doughnut"
          [data]="customerChartData">
        </app-chart-widget>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <app-top-selling-table [items]="topItems"></app-top-selling-table>
      </div>
    </div>
  </div>
</div>
