<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Categories</h2>
    <button class="btn btn-primary" (click)="addCategory()">
      <i class="bi bi-plus-circle"></i> Add Category
    </button>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div class="card" *ngIf="!loading">
    <div class="card-body">
      <p class="text-muted small mb-3">
        <i class="bi bi-info-circle"></i> Drag and drop to reorder categories
      </p>
      <div cdkDropList (cdkDropListDropped)="drop($event)" class="category-list">
        <div class="category-item" 
             *ngFor="let category of categories; trackBy: trackByCategoryId" 
             cdkDrag>
          <div class="d-flex align-items-center p-3 border rounded mb-2" 
               style="cursor: move; background: white;">
            <i class="bi bi-grip-vertical text-muted me-3"></i>
            <img [src]="category.imageUrl || 'https://via.placeholder.com/50'" 
                 [alt]="category.name"
                 class="rounded me-3"
                 style="width: 50px; height: 50px; object-fit: cover;">
            <div class="flex-grow-1">
              <h6 class="mb-0">{{ category.name }}</h6>
              <small class="text-muted">Order: {{ category.displayOrder || 0 }}</small>
            </div>
            <div class="btn-group">
              <button class="btn btn-sm btn-outline-primary" (click)="editCategory(category)">
                <i class="bi bi-pencil"></i> Edit
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteCategory(category.id)">
                <i class="bi bi-trash"></i> Delete
              </button>
            </div>
          </div>
        </div>
        <div class="text-center text-muted py-4" *ngIf="categories.length === 0">
          No categories found
        </div>
      </div>
    </div>
  </div>

  <app-add-edit-category-form 
    [category]="selectedCategory"
    [isOpen]="isFormOpen"
    (save)="saveCategory($event)"
    (close)="closeForm()">
  </app-add-edit-category-form>
</div>
