<div class="container-fluid">
  <h2 class="mb-4">Settings</h2>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="success" class="alert alert-success">{{ success }}</div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <form (ngSubmit)="saveSettings()" *ngIf="!loading">
    <div class="row">
      <div class="col-md-6">
        <div class="card mb-3">
          <div class="card-header">
            <h5 class="mb-0">Restaurant Information</h5>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">Restaurant Name *</label>
              <input type="text" class="form-control" [(ngModel)]="settings.restaurantName" 
                     name="restaurantName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" [(ngModel)]="settings.description" 
                        name="description" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" [(ngModel)]="settings.address" 
                     name="address">
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" [(ngModel)]="settings.phone" 
                       name="phone">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" [(ngModel)]="settings.email" 
                       name="email">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card mb-3">
          <div class="card-header">
            <h5 class="mb-0">Pricing & Payment</h5>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">Currency</label>
              <select class="form-select" [(ngModel)]="settings.currency" name="currency">
                <option value="KWD">KWD</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Tax Rate (%)</label>
              <input type="number" class="form-control" [(ngModel)]="settings.taxRate" 
                     name="taxRate" step="0.01" min="0">
            </div>
            <div class="mb-3">
              <label class="form-label">Delivery Fee ({{ settings.currency }})</label>
              <input type="number" class="form-control" [(ngModel)]="settings.deliveryFee" 
                     name="deliveryFee" step="0.01" min="0">
            </div>
            <div class="mb-3">
              <label class="form-label">Payment Options</label>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" 
                       [checked]="isPaymentEnabled('Cash')"
                       (change)="togglePaymentOption('Cash')" id="cash">
                <label class="form-check-label" for="cash">Cash</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" 
                       [checked]="isPaymentEnabled('KNET')"
                       (change)="togglePaymentOption('KNET')" id="knet">
                <label class="form-check-label" for="knet">KNET</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" 
                       [checked]="isPaymentEnabled('Visa')"
                       (change)="togglePaymentOption('Visa')" id="visa">
                <label class="form-check-label" for="visa">Visa</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-header">
        <h5 class="mb-0">Business Hours</h5>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-6" *ngFor="let hours of settings.businessHours">
            <div class="mb-3">
              <div class="d-flex align-items-center mb-2">
                <input type="checkbox" class="form-check-input me-2" 
                       [(ngModel)]="hours.isClosed" 
                       [name]="'closed-' + hours.day">
                <label class="form-label mb-0 fw-bold">{{ hours.day }}</label>
              </div>
              <div class="row" *ngIf="!hours.isClosed">
                <div class="col-6">
                  <label class="form-label small">Open</label>
                  <input type="time" class="form-control form-control-sm" 
                         [(ngModel)]="hours.openTime" 
                         [name]="'open-' + hours.day">
                </div>
                <div class="col-6">
                  <label class="form-label small">Close</label>
                  <input type="time" class="form-control form-control-sm" 
                         [(ngModel)]="hours.closeTime" 
                         [name]="'close-' + hours.day">
                </div>
              </div>
              <div *ngIf="hours.isClosed" class="text-muted small">Closed</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end">
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>
        Save Settings
      </button>
    </div>
  </form>
</div>
